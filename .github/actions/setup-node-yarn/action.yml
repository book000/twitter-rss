name: Setup yarn (corepack)
description: >-
  Node.js 25 以降は Corepack が同梱されないため、Corepack を明示インストールして Yarn を有効化する。
  呼び出し側で actions/checkout と actions/setup-node を先に実行すること。

runs:
  using: composite
  steps:
    - name: Install corepack
      shell: bash
      run: npm install -g corepack@0.36.0

    - name: Enable corepack
      shell: bash
      run: corepack enable
