# Node.js / Corepack / Yarn のセットアップ互換性を PR 時に検証する。
# update-rss.yml と同じセットアップ手順を使う。secrets と self-hosted runner は使わない。

name: Setup Check

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - .node-version
      - package.json
      - yarn.lock
      - .github/workflows/update-rss.yml
      - .github/workflows/setup-check.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # update-rss.yml と同じ手順
      - name: Enable corepack (yarn)
        run: |
          npm install -g corepack@0.36.0
          corepack enable

      - name: Check yarn version
        run: |
          expected=$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]")
          actual=$(yarn --version)
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"

      - name: Install nodejs dependencies
        run: yarn install --frozen-lockfile
